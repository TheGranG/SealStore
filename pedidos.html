<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CEDIS - Estilo 7-Eleven</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { 
            --bg-main: #f4f6f8; 
            --panel-bg: #ffffff; 
            --7v-green: #007934; 
            --7v-red: #E11B22; 
            --7v-orange: #F37021; 
            --text-main: #333333; 
            --text-muted: #6b7280; 
            --border: #e5e7eb; 
            --input-bg: #f9fafb;
            --info-blue: #0284c7;
            --info-bg: #e0f2fe;
        }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; display: flex; height: 100vh; 
            background-color: var(--bg-main); color: var(--text-main); 
            overflow: hidden; 
        }

        nav { 
            width: 90px; background: var(--panel-bg); 
            display: flex; flex-direction: column; align-items: center; 
            padding-top: 15px; border-right: 1px solid var(--border); 
            flex-shrink: 0; z-index: 100;
        }
        .nav-item { 
            width: 100%; padding: 15px 0; display: flex; 
            flex-direction: column; align-items: center; 
            color: var(--text-muted); cursor: pointer; transition: 0.2s; 
            border-left: 4px solid transparent; text-decoration: none; 
        }
        .nav-item:hover, .nav-item.active { 
            color: var(--7v-green); background-color: #f0fdf4; 
            border-left: 4px solid var(--7v-green); 
        }
        .nav-item i { font-size: 1.5rem; margin-bottom: 5px; }
        .nav-item span { font-size: 0.7rem; font-weight: 700; text-align: center; }

        .main-content { flex-grow: 1; padding: 15px; display: flex; flex-direction: column; overflow-y: auto; }
        
        .top-bar { 
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 15px; background: var(--panel-bg); 
            padding: 12px 20px; border-radius: 8px; border: 1px solid var(--border);
            border-top: 4px solid var(--7v-orange);
            flex-shrink: 0;
        }
        
        .top-bar-right { display: flex; align-items: center; gap: 12px; }

        .btn-user {
            background: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.95rem;
        }
        .btn-user:hover {
            border-color: var(--7v-green);
            color: var(--7v-green);
            background: #f0fdf4;
        }

        .header-actions { display: flex; justify-content: space-between; align-items: center; background: var(--panel-bg); padding: 15px 20px; border-radius: 8px; margin-bottom: 15px; border: 1px solid var(--border); flex-shrink: 0;}
        .btn-primary { background: var(--7v-green); color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.95rem; transition: 0.2s;}
        .btn-primary:hover { background: #005c27; }
        .btn-sync { background: var(--panel-bg); border: 1px solid var(--border); color: var(--text-main); padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.9rem; transition: 0.2s;}
        .btn-sync:hover { border-color: var(--7v-green); color: var(--7v-green); background: #f0fdf4;}
        
        .toggle-container { display: flex; align-items: center; gap: 10px; color: var(--text-main); font-size: 0.9rem; margin-top: 5px;}
        input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--7v-green); cursor: pointer;}
        
        .table-container { background: var(--panel-bg); border-radius: 8px; margin-bottom: 15px; border: 1px solid var(--border); overflow-y: auto; flex-grow: 1; min-height: 200px;}
        .table-container-small { background: var(--panel-bg); border-radius: 8px; margin-bottom: 15px; border: 1px solid var(--border); overflow-y: auto; height: 25vh; flex-shrink: 0;}
        
        table { width: 100%; border-collapse: collapse; }
        th { position: sticky; top: 0; background: var(--input-bg); padding: 12px; text-align: left; font-size: 0.75rem; color: var(--text-muted); z-index: 10; text-transform: uppercase; border-bottom: 2px solid var(--border);}
        td { padding: 12px; border-bottom: 1px solid var(--border); vertical-align: middle; font-size: 0.9rem;}
        
        .sku-tag { font-family: monospace; font-size: 0.85rem; color: var(--text-muted);}
        
        .stepper { display: flex; align-items: center; gap: 5px; }
        .input-qty { width: 50px; background: var(--input-bg); border: 1px solid var(--border); color: var(--text-main); padding: 6px; border-radius: 4px; text-align: center; font-weight: bold; outline: none;}
        .btn-step { background: var(--panel-bg); border: 1px solid var(--border); color: var(--text-main); width: 28px; height: 28px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s;}
        .btn-step:hover { background: var(--input-bg); border-color: var(--7v-green); color: var(--7v-green);}
        
        .status-pill { padding: 4px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: bold; display: inline-block; text-align: center; min-width: 70px;}
        .status-sano { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .status-critico { background: #fef9c3; color: #854d0e; border: 1px solid #fef08a; }
        .status-agotado { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        .status-info { background: var(--info-bg); color: var(--info-blue); border: 1px solid #bae6fd; }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            nav { width: 100%; height: 70px; flex-direction: row; justify-content: space-around; padding: 0; border-right: none; border-top: 1px solid var(--border); order: 3; }
            .nav-item { padding: 10px 0; border-left: none; border-bottom: 4px solid transparent; }
            .nav-item.active { border-left: none; border-bottom: 4px solid var(--7v-green); background-color: transparent; }
            .nav-item span { display: none; }
            
            .main-content { padding: 10px; padding-bottom: 0; }
            .top-bar h2 { font-size: 1.2rem; }
            .header-actions { flex-direction: column; align-items: stretch; gap: 10px; }
            .btn-primary { width: 100%; }
            th:nth-child(2), td:nth-child(2) { display: none; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="venta.html" class="nav-item"><i class="fas fa-cash-register"></i><span>Venta</span></a>
        <a href="inventario.html" class="nav-item"><i class="fas fa-boxes"></i><span>Inventario</span></a>
        <a href="sucursales.html" class="nav-item"><i class="fas fa-store"></i><span>Sucursales</span></a>
        <a href="pedidos.html" class="nav-item active"><i class="fas fa-truck-loading"></i><span>Pedidos</span></a>
        <a href="prestamos.html" class="nav-item"><i class="fas fa-handshake"></i><span>Prestamos</span></a>
        <a href="reportes.html" class="nav-item"><i class="fas fa-chart-line"></i><span>Registro</span></a>
        <a href="usuarios.html" class="nav-item"><i class="fas fa-users-cog"></i><span>Usuarios</span></a>
    </nav>

    <main class="main-content">
        <div class="top-bar">
            <h2 style="margin:0;"><i class="fas fa-truck-loading" style="color: var(--7v-orange);"></i> Reabastecimiento Productos</h2>
            <div class="top-bar-right">
                <button onclick="inicializar()" class="btn-sync" title="Sincronizar Listas"><i class="fas fa-sync-alt"></i></button>
                <button class="btn-user" onclick="abrirLogin()">
                    <i class="fas fa-user-circle" style="font-size: 1.2rem; color: var(--7v-green);"></i>
                    <span id="usuario-nombre">Caja 1</span>
                </button>
            </div>
        </div>

        <div class="header-actions">
            <div>
                <h3 style="margin: 0 0 5px 0; font-size: 1.1rem; color: var(--text-main);">Generar Orden</h3>
                <div class="toggle-container">
                    <input type="checkbox" id="toggle-todo" onchange="renderizarCatalogo()">
                    <label for="toggle-todo">Mostrar catálogo completo (Pedido Libre)</label>
                </div>
            </div>
            <button class="btn-primary" onclick="procesarPedido()"><i class="fas fa-paper-plane"></i> Enviar Petición</button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr><th>Código</th><th>Producto</th><th style="text-align: center;">Stock Piso</th><th style="text-align: center;">Mínimo Ideal</th><th style="text-align: center;">Estado</th><th>Cantidad a Pedir</th></tr>
                </thead>
                <tbody id="tabla-pedidos">
                    <tr><td colspan="6" style="text-align: center; padding: 30px; color: var(--text-muted);">Cargando catálogo...</td></tr>
                </tbody>
            </table>
        </div>

        <h3 style="font-size: 1.1rem; color: var(--info-blue); margin: 0 0 10px 0;"><i class="fas fa-route"></i> Seguimiento</h3>
        <div class="table-container-small">
            <table>
                <thead>
                    <tr><th>Fecha Solicitud</th><th>Folio Carga</th><th>Código</th><th style="text-align:center;">Cantidad</th><th style="text-align:center;">Estatus CEDIS</th><th>Acción Tienda</th></tr>
                </thead>
                <tbody id="tabla-rastreo">
                    <tr><td colspan="6" style="text-align: center; padding: 30px; color: var(--text-muted);">Cargando rastreo satelital...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script>
    let inventarioGlobal = [];
    const SUCURSAL_LOCAL = 8; // Tu sucursal

    function abrirLogin() {
        Swal.fire({
            title: 'Control de Acceso',
            text: 'Módulo en construcción.',
            icon: 'info',
            background: '#ffffff', color: '#333333', confirmButtonColor: '#007934'
        });
    }

    async function cargarInventario() {
        try {
            const res = await fetch('api_inventario.php');
            const text = await res.text();
            
            try {
                const data = JSON.parse(text);
                if (data.error) throw new Error(data.mensaje);
                
                inventarioGlobal = data;
                inventarioGlobal.forEach(item => { item.pedidoSugerido = 0; });
                renderizarCatalogo();
            } catch (parseError) {
                document.getElementById('tabla-pedidos').innerHTML = `<tr><td colspan="6" style="text-align:center; color: var(--7v-red); padding:30px;">Error PHP: ${text.substring(0, 80)}...</td></tr>`;
            }
        } catch (e) { 
            document.getElementById('tabla-pedidos').innerHTML = '<tr><td colspan="6" style="text-align:center; color: var(--7v-orange); padding:30px;">Error de red.</td></tr>'; 
        }
    }

    function renderizarCatalogo() {
        const tbody = document.getElementById('tabla-pedidos');
        tbody.innerHTML = '';
        const verTodo = document.getElementById('toggle-todo').checked;
        
        // Filtro blindado contra valores nulos
        const data = verTodo ? inventarioGlobal : inventarioGlobal.filter(i => {
            const prod = i.productos || {};
            return parseInt(i.cantidad_actual || 0) <= parseInt(prod.stock_minimo_alerta || 1);
        });

        if (data.length === 0 && inventarioGlobal.length > 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding: 30px; color:var(--text-muted);">Todo el stock está en niveles óptimos.</td></tr>';
            return;
        }

        data.forEach(item => {
            const prod = item.productos || {}; // Respaldo de seguridad
            const stock = parseInt(item.cantidad_actual || 0);
            const min = parseInt(prod.stock_minimo_alerta || 5);
            const nombreMostrar = prod.nombre_producto || 'Sin Nombre';
            const sku = item.sku_id;
            
            let estado = '<span class="status-pill status-sano">SANO</span>';
            let colorStock = 'var(--7v-green)';

            if (stock === 0) {
                estado = '<span class="status-pill status-agotado">AGOTADO</span>';
                colorStock = 'var(--7v-red)';
            } else if (stock <= min) {
                estado = '<span class="status-pill status-critico">REORDEN</span>';
                colorStock = 'var(--7v-orange)';
            }

            tbody.innerHTML += `<tr>
                <td><span class="sku-tag">${sku}</span></td>
                <td><div style="font-weight: bold; color: var(--text-main);">${nombreMostrar}</div><div style="font-size: 0.8rem; color: var(--text-muted);">${prod.marca || 'Genérico'}</div></td>
                <td style="font-weight: bold; text-align: center; font-size:1.1rem; color:${colorStock};">${stock}</td>
                <td style="color: var(--text-muted); text-align: center;">${min}</td>
                <td style="text-align:center;">${estado}</td>
                <td>
                    <div class="stepper">
                        <button class="btn-step" onclick="cambiarCant('${sku}', -1)">-</button>
                        <input type="number" class="input-qty" value="${item.pedidoSugerido}" onchange="escribirCant('${sku}', this.value)" style="outline: none;">
                        <button class="btn-step" onclick="cambiarCant('${sku}', 1)">+</button>
                    </div>
                </td>
            </tr>`;
        });
    }

    function cambiarCant(sku, delta) {
        const item = inventarioGlobal.find(i => i.sku_id === sku);
        if(!item) return;
        item.pedidoSugerido += delta;
        if(item.pedidoSugerido < 0) item.pedidoSugerido = 0;
        renderizarCatalogo();
    }

    function escribirCant(sku, valor) {
        const item = inventarioGlobal.find(i => i.sku_id === sku);
        if(!item) return;
        let nuevaCant = parseInt(valor);
        if (isNaN(nuevaCant) || nuevaCant < 0) nuevaCant = 0;
        item.pedidoSugerido = nuevaCant;
        renderizarCatalogo();
    }

    async function procesarPedido() {
        const items = inventarioGlobal.filter(i => i.pedidoSugerido > 0).map(i => ({ sku: i.sku_id, cantidad: i.pedidoSugerido }));
        if (items.length === 0) return Swal.fire({icon: 'info', title: 'Carro Vacío', text: 'Suma artículos al pedido.', background: '#ffffff', color: '#333333', confirmButtonColor: '#007934'});

        Swal.fire({title: 'Registrando orden...', background: '#ffffff', color: '#333333', didOpen: () => Swal.showLoading()});
        try {
            const res = await fetch('api_procesar_pedido.php', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ items: items }) });
            const data = await res.json();
            
            if (!data.error) { 
                Swal.fire({icon: 'success', title: 'Pedido Enviado', text: 'Esperando despacho del CEDIS.', background: '#ffffff', color: '#333333', confirmButtonColor: '#007934'}); 
                inicializar(); 
            } else {
                Swal.fire({icon: 'error', title: 'Aviso BD', text: data.mensaje, background: '#ffffff', color: '#333333', confirmButtonColor: '#F37021'});
            }
        } catch (e) { 
            Swal.fire({icon: 'error', title: 'Error', text: 'Fallo al procesar pedido.', background: '#ffffff', color: '#333333'}); 
        }
    }

   async function cargarRastreoMatriz() {
    const tbody = document.getElementById('tabla-rastreo');
    try {
        const res = await fetch('api_rastreo_pedidos.php');
        const movimientos = await res.json();
        tbody.innerHTML = '';
        
        const activos = movimientos.filter(m => {
            const est = m.tipo_movimiento.toUpperCase();
            return est !== 'ENTREGADO' && est !== 'COMPLETADO';
        });

        if(activos.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#9ca3af; padding: 20px;">Sin órdenes activas.</td></tr>';
            return;
        }

        activos.forEach(m => {
            const tipo = m.tipo_movimiento.toUpperCase();
            let estadoHtml = '';
            let btnAction = '';

            if (tipo === 'EN_TRANSITO' || tipo === 'EN_CAMINO') {
                estadoHtml = '<span class="status-pill" style="background:#dcfce7; color:#166534; padding: 4px 10px; border-radius: 20px;">EN TRÁNSITO</span>'; 
                btnAction = `<button style="background:#007934; color:white; padding:5px 10px; border:none; border-radius:4px; cursor:pointer;" onclick="ingresarAlmacenLocal(${m.id_movimiento})">Recibir</button>`;
            } else {
                estadoHtml = '<span class="status-pill" style="background:#fef9c3; color:#854d0e; padding: 4px 10px; border-radius: 20px;">PENDIENTE</span>';
                btnAction = `<span style="color:#9ca3af; font-size:0.8rem;">Esperando a Matriz</span>`;
            }

            const fecha = new Date(m.fecha_movimiento).toLocaleString('es-MX', {hour12:true, month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});

            tbody.innerHTML += `<tr>
                <td style="color:#9ca3af; font-size:0.85rem;">${fecha}</td>
                <td><span class="sku-tag" style="background: #374151; padding: 3px 6px; border-radius: 4px;">${m.folio_referencia}</span></td>
                <td style="font-weight:bold;">${m.sku_id}</td>
                <td style="text-align:center; font-weight:bold;">${m.cantidad}</td>
                <td style="text-align:center;">${estadoHtml}</td>
                <td style="text-align:center;">${btnAction}</td>
            </tr>`;
        });
    } catch (e) { 
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#E11B22; padding: 20px;">Error de conexión.</td></tr>'; 
    }
}

    async function ingresarAlmacenLocal(idMov) {
        Swal.fire({title: 'Ingresando stock...', background: '#ffffff', color: '#333333', didOpen: () => Swal.showLoading()});
        try {
            const res = await fetch('api_ingresar_pedido_matriz.php', {
                method: 'POST', 
                headers: {'Content-Type':'application/json'}, 
                body: JSON.stringify({ id_movimiento: idMov }) 
            });
            const data = await res.json();
            if(!data.error) {
                Swal.fire({icon: 'success', title: '¡Recepción Exitosa!', text: 'El stock fue escaneado e ingresado a piso.', background: '#ffffff', color: '#333333', confirmButtonColor: '#007934'});
                cargarInventario();
                cargarRastreoMatriz();
            } else {
                Swal.fire({icon: 'error', title: 'Error', text: data.mensaje, background: '#ffffff', color: '#333333', confirmButtonColor: '#F37021'});
            }
        } catch(e) { 
            Swal.fire({icon: 'error', title: 'Error', text: 'Error de red.', background: '#ffffff', color: '#333333', confirmButtonColor: '#F37021'}); 
        }
    }

    function inicializar() {
        cargarInventario();
        cargarRastreoMatriz();
    }

    window.onload = inicializar;
    </script>
</body>
</html>
